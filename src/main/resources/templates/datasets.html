<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/general.html :: headerfiles}"></th:block>
    <th:block th:replace="~{fragments/general.html :: datatable-styles}"></th:block>
    <th:block th:replace="~{fragments/general.html :: map-styles}"></th:block>
</head>
<body class="app-shell sky-bg">
    <th:block th:replace="~{fragments/general.html :: navbar}"></th:block>
    <main class="app-main">
        <div class="container-fluid app-container">
            <th:block th:replace="~{fragments/general.html :: login-card}"></th:block>
            <th:block th:replace="~{fragments/general.html :: page-header(
                'fa-layer-group',
                'S-201 Datasets',
                'Create, publish and retire the S-201 datasets served to the SECOM clients')}"></th:block>
            <div class="card app-card" sec:authorize="isAuthenticated()">
                <div class="card-header">
                    <i class="fa-solid fa-sliders"></i>
                    <h2>Dataset catalogue</h2>
                    <div class="toolbar-switch form-check form-switch ms-auto">
                        <input id="showCancelledDatasetsSwitch" class="form-check-input" type="checkbox">
                        <label for="showCancelledDatasetsSwitch" class="form-check-label">Include cancelled datasets</label>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-shell">
                        <table id="dataset_table" class="table table-sm table-striped row-border hover w-100"></table>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <th:block th:replace="~{fragments/general.html :: footer}"></th:block>

    <div class="modal fade" id="datasetGeometryPanel" tabindex="-1" role="dialog" aria-labelledby="datasetGeometryPanelHeader"
         aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="datasetGeometryPanelHeader">
                        <i class="fa-solid fa-draw-polygon"></i>Dataset Area
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="cell-muted small mb-3">
                        <i class="fa-solid fa-circle-info"></i>
                        Use the drawing tools on the left of the map to define the area covered by this dataset,
                        then save your changes.
                    </p>
                    <!-- map container -->
                    <div id="datasetGeometryMap" class="map border"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-bs-dismiss="modal" title="Cancel Changes">
                        <i class="fa-solid fa-xmark"></i><span class="btn-label">Cancel</span>
                    </button>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" title="Save Changes" onclick="saveGeometry()">
                        <i class="fa-solid fa-floppy-disk"></i><span class="btn-label">Save</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="datasetContentPanel" tabindex="-1" role="dialog" aria-labelledby="datasetContentPanelHeader"
         aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="datasetContentPanelHeader">
                        <i class="fa-solid fa-code"></i>S-201 Dataset Content
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <textarea class="form-control form-control-sm code-view" id="datasetContentTextArea" rows="26" readonly></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-bs-dismiss="modal" title="Close">
                        <i class="fa-solid fa-xmark"></i><span class="btn-label">Close</span>
                    </button>
                    <button type="button" class="btn btn-primary" title="Copy the dataset content to the clipboard"
                            onclick="copyToClipboard('#datasetContentTextArea')">
                        <i class="fa-solid fa-copy"></i><span class="btn-label">Copy</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/general.html :: confirmation-dialog}"></th:block>
    <th:block th:replace="~{fragments/general.html :: error-dialog}"></th:block>

    <th:block th:replace="~{fragments/general.html :: core-scripts}"></th:block>
    <th:block th:replace="~{fragments/general.html :: map-scripts}"></th:block>
    <th:block th:replace="~{fragments/general.html :: datatable-scripts}"></th:block>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script type="text/javascript" th:src="@{/src/datasets.js}"></script>
</body>
</html>
