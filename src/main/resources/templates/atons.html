<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/general.html :: headerfiles}"></th:block>
    <th:block th:replace="~{fragments/general.html :: datatable-styles}"></th:block>
    <th:block th:replace="~{fragments/general.html :: map-styles}"></th:block>
</head>
<body class="app-shell sky-bg">
    <th:block th:replace="~{fragments/general.html :: navbar}"></th:block>
    <main class="app-main">
        <div class="container-fluid app-container">
            <th:block th:replace="~{fragments/general.html :: login-card}"></th:block>
            <th:block th:replace="~{fragments/general.html :: page-header(
                'fa-tower-observation',
                'Aids to Navigation',
                'Browse, inspect and manage every Aid to Navigation known to this service')}"></th:block>
            <div class="card app-card" sec:authorize="isAuthenticated()">
                <div class="card-body">
                    <div class="table-shell">
                        <table id="atons_table" class="table table-sm table-striped row-border hover w-100"></table>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <th:block th:replace="~{fragments/general.html :: footer}"></th:block>

    <div class="modal fade" id="atonGeometryPanel" tabindex="-1" role="dialog" aria-labelledby="atonGeometryPanelHeader"
         aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="atonGeometryPanelHeader">
                        <i class="fa-solid fa-map-location-dot"></i>AtoN Location
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
                        <div class="stat-tile flex-fill">
                            <span class="stat-icon"><i class="fa-solid fa-tower-observation"></i></span>
                            <div>
                                <div class="stat-value" id="atonGeometryName">&mdash;</div>
                                <div class="stat-label" id="atonGeometryType">AtoN</div>
                            </div>
                        </div>
                        <div class="stat-tile flex-fill">
                            <span class="stat-icon"><i class="fa-solid fa-location-crosshairs"></i></span>
                            <div>
                                <div class="stat-value cell-mono" id="atonGeometryPosition">&mdash;</div>
                                <div class="stat-label">Latitude / Longitude</div>
                            </div>
                        </div>
                    </div>
                    <!-- map container -->
                    <div id="atonGeometryMap" class="map border"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-bs-dismiss="modal" title="Close">
                        <i class="fa-solid fa-xmark"></i><span class="btn-label">Close</span>
                    </button>
                    <a class="btn btn-primary" id="atonGeometryChartLink" th:href="@{map}" title="Open this AtoN on the chart">
                        <i class="fa-solid fa-earth-europe"></i><span class="btn-label">Open on the chart</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="atonContentPanel" tabindex="-1" role="dialog" aria-labelledby="atonContentPanelHeader"
         aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="atonContentPanelHeader">
                        <i class="fa-solid fa-code"></i>AtoN S-201 Representation
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <textarea class="form-control form-control-sm code-view" id="atonContentTextArea" rows="26" readonly></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-bs-dismiss="modal" title="Close">
                        <i class="fa-solid fa-xmark"></i><span class="btn-label">Close</span>
                    </button>
                    <button type="button" class="btn btn-primary" title="Copy the S-201 content to the clipboard"
                            onclick="copyToClipboard('#atonContentTextArea')">
                        <i class="fa-solid fa-copy"></i><span class="btn-label">Copy</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/general.html :: confirmation-dialog}"></th:block>
    <th:block th:replace="~{fragments/general.html :: error-dialog}"></th:block>

    <th:block th:replace="~{fragments/general.html :: core-scripts}"></th:block>
    <th:block th:replace="~{fragments/general.html :: map-scripts}"></th:block>
    <th:block th:replace="~{fragments/general.html :: datatable-scripts}"></th:block>
    <script type="text/javascript" th:src="@{/src/atons.js}"></script>
</body>
</html>
