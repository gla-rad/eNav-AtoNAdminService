<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/general.html :: headerfiles}"></th:block>
</head>
<body class="app-shell sky-bg">
    <noscript>
        <div class="alert alert-danger rounded-0 mb-0 text-center">
            This application relies on JavaScript being enabled. Please enable it and reload the page.
        </div>
    </noscript>
    <th:block th:replace="~{fragments/general.html :: navbar}"></th:block>
    <main class="app-main">
        <div class="container-fluid app-container">
            <th:block th:replace="~{fragments/general.html :: login-card}"></th:block>
            <th:block th:replace="~{fragments/general.html :: page-header(
                'fa-gauge-high',
                'AtoN Message Monitoring',
                'Watch the Aids to Navigation flowing through the service as they are published')}"></th:block>

            <div class="card app-card" sec:authorize="isAuthenticated()">
                <div class="card-header">
                    <i class="fa-solid fa-plug"></i>
                    <h2>Endpoint connection</h2>
                    <span id="connectionStatus" class="tag ms-auto">
                        <i class="fa-solid fa-circle"></i>Disconnected
                    </span>
                </div>
                <div class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-12 col-md-5">
                            <label class="form-label small fw-semibold" for="endpoint">Dataset topic</label>
                            <select name="VDES Connection" id="endpoint" class="form-select">
                                <option th:each="endpoint : ${endpoints}" th:value="${endpoint}" th:text="${endpoint}"/>
                            </select>
                        </div>
                        <div class="col-12 col-md-7 d-flex flex-wrap gap-2">
                            <button id="connect" class="btn btn-primary" type="button">
                                <i class="fa-solid fa-play"></i><span>Connect</span>
                            </button>
                            <button id="disconnect" class="btn btn-default" type="button" disabled="disabled">
                                <i class="fa-solid fa-stop"></i><span>Disconnect</span>
                            </button>
                            <button id="clear" class="btn btn-default ms-md-auto" type="button">
                                <i class="fa-solid fa-broom"></i><span>Clear</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card app-card mt-3" sec:authorize="isAuthenticated()">
                <div class="card-header">
                    <i class="fa-solid fa-rss"></i>
                    <h2>Incoming messages</h2>
                    <span id="messageCount" class="tag tag-accent ms-auto">0</span>
                </div>
                <div class="card-body">
                    <div class="table-shell">
                        <table id="messages" class="table table-sm table-striped align-middle mb-0">
                            <thead>
                            <tr>
                                <th>ID Code</th>
                                <th>Description</th>
                                <th>Start Date</th>
                                <th>End Date</th>
                            </tr>
                            </thead>
                            <tbody id="incoming"></tbody>
                        </table>
                    </div>
                    <div id="messagesEmpty" class="empty-state">
                        <i class="fa-solid fa-satellite-dish"></i>
                        <span>Connect to a dataset topic to start receiving messages</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <th:block th:replace="~{fragments/general.html :: footer}"></th:block>

    <th:block th:replace="~{fragments/general.html :: core-scripts}"></th:block>
    <script th:src="@{/webjars/sockjs-client/sockjs.min.js}"></script>
    <script th:src="@{/webjars/stomp-websocket/stomp.min.js}"></script>
    <script th:src="@{/src/index.js}"></script>
</body>
</html>
