<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/general.html :: headerfiles}"></th:block>
</head>
<body class="app-shell sky-bg">
    <th:block th:replace="~{fragments/general.html :: navbar}"></th:block>
    <main class="app-main">
        <div class="container-fluid app-container">
            <th:block th:replace="~{fragments/general.html :: login-card}"></th:block>
            <th:block th:replace="~{fragments/general.html :: page-header(
                'fa-circle-info',
                'About this service',
                'The identity and the operator of this e-Navigation microservice')}"></th:block>

            <div class="card app-card" sec:authorize="isAuthenticated()">
                <div class="card-header">
                    <i class="fa-solid fa-id-card"></i>
                    <h2>Service information</h2>
                </div>
                <div class="card-body">
                    <div class="info-row">
                        <div class="info-label">Name</div>
                        <div class="info-value">[[${appName}]]</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Version</div>
                        <div class="info-value"><span class="tag tag-accent">[[${appVersion}]]</span></div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Operator name</div>
                        <div class="info-value">[[${appOperatorName}]]</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Contact</div>
                        <div class="info-value cell-mono">[[${appOperatorContact}]]</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Operator website</div>
                        <div class="info-value">
                            <a th:href="@{${appOperatorUrl}}" target="_blank" rel="noopener">[[${appOperatorUrl}]]</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>
    <th:block th:replace="~{fragments/general.html :: footer}"></th:block>

    <th:block th:replace="~{fragments/general.html :: core-scripts}"></th:block>
</body>
</html>
